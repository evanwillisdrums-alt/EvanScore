name: EvanScore Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rounded-ui-windows-preview
    paths-ignore:
      - 'share/plugins/**'
      - 'AGENTS.md'
      - '.github/workflows/package_evanscore_plugin_update.yml'
      - '.github/workflows/diagnose_evanscore_windows_startup.yml'
      - 'buildscripts/ci/windows/check_evanscore_gui.ps1'
      - 'buildscripts/ci/windows/observe_evanscore_exceptions.ps1'
      - 'buildscripts/ci/windows/startup-inspector/**'
      - '.github/workflows/check_evanscore_windows_cache.yml'

permissions:
  contents: read

concurrency:
  group: evanscore-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_VERSION: evanscore-msvc-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/buildscripts/ci/windows/sccache-toolchain.cmake
    steps:
      - name: Check out the app and pinned dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the repository's Qt version
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat qtnetworkauth qtshadertools qtwebsockets
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          py7zrversion: '@git+https://github.com/miurahr/py7zr.git'

      - name: Set up Windows build tools
        shell: cmd
        run: buildscripts\ci\windows\setup.bat

      - name: Install the verified compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Install locked Python tools
        shell: pwsh
        run: |
          python -m pip install pdm==2.26.1
          if ($LASTEXITCODE -ne 0) { throw 'PDM installation failed' }
          pdm install --frozen-lockfile --no-self
          if ($LASTEXITCODE -ne 0) { throw 'Locked tool installation failed' }

      - name: Configure development build
        shell: bash
        run: |
          bash buildscripts/ci/tools/make_build_mode_env.sh -e "$GITHUB_EVENT_NAME" -m devel
          bash buildscripts/ci/tools/make_build_number.sh "$GITHUB_RUN_NUMBER"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Generate English translations
        shell: bash
        env:
          LUPDATE_ARGS: ''
          POSTPROCESS_ARGS: --warn-only --generate-placeholder-translations
          POSTPROCESS_LAUNCHER: pdm run python -X utf8
        run: bash tools/translations/run_lupdate.sh

      - name: Compile and deploy the native app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build.artifacts | Out-Null
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cmd /c "buildscripts\ci\windows\build.bat -n $env:BUILD_NUMBER --dockwidgets_v2 ON" 2>&1 | Tee-Object -FilePath build.artifacts/Windows-build.log
          $buildExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($buildExit -ne 0) {
            # Collect further independent compiler failures in the same runner.
            # Ninja still returns failure; this never permits packaging a failed build.
            if (Test-Path build.release/build.ninja) {
              $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
              $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              $vcvars = Join-Path $vsInstall 'VC/Auxiliary/Build/vcvars64.bat'
              @"
          @echo off
          call "$vcvars" > nul
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build.release --parallel 4 -- -k 0
          "@ | Set-Content build.artifacts/collect-compiler-errors.bat -Encoding ascii
              $ErrorActionPreference = 'Continue'
              cmd /c build.artifacts\collect-compiler-errors.bat 2>&1 | Tee-Object -FilePath build.artifacts/Windows-build.log -Append
              $ErrorActionPreference = 'Stop'
            }
            throw "Native compilation failed with code $buildExit"
          }

      - name: Retain matching native symbols for startup diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: EvanScore-Windows-native-symbols
          path: build.release/**/MuseScore*.pdb
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify executable and export a score
        shell: pwsh
        run: ./buildscripts/ci/windows/verify_evanscore_app.ps1

      - name: Stage the Windows package for clean-machine verification
        uses: actions/upload-artifact@v7
        with:
          name: EvanScore-Windows-candidate
          path: build.install/
          if-no-files-found: error
          retention-days: 3

      - name: Retain compiled app for failed startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: EvanScore-Windows-diagnostic-only
          path: build.install/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload build checks and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: EvanScore-Windows-build-checks
          path: build.artifacts/
          if-no-files-found: ignore
          retention-days: 14

  portable:
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: EvanScore-Windows-candidate
          path: build.install
      # This runner has no Qt SDK or native build outputs. The exact extracted
      # package must supply its own runtime and pass every desktop/export check.
      - name: Verify the extracted app on a fresh Windows machine
        shell: pwsh
        run: ./buildscripts/ci/windows/verify_evanscore_app.ps1
      - name: Upload the verified runnable Windows app
        uses: actions/upload-artifact@v7
        with:
          name: EvanScore-Windows-x64
          path: build.install/
          if-no-files-found: error
          retention-days: 14
      - name: Upload fresh-machine checks
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EvanScore-Windows-portable-checks
          path: build.artifacts/
          if-no-files-found: ignore
          retention-days: 14
