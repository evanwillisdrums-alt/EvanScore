name: EvanScore Windows startup diagnostic

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Windows app build run to test
        required: true
        default: '37817852210'
      artifact_name:
        description: App artifact to inspect (diagnostic-only archives are not releases)
        type: choice
        options:
          - EvanScore-Windows-x64
          - EvanScore-Windows-diagnostic-only
        default: EvanScore-Windows-x64
      log_artifact:
        description: Diagnostic log artifact to inspect
        default: EvanScore-Windows-build-checks
      mode:
        description: Inspect launch logs or run desktop checks
        type: choice
        options:
          - inspect-logs
          - desktop
          - exceptions
        default: inspect-logs

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    if: inputs.mode == 'inspect-logs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.log_artifact }}
          path: checks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Report launch diagnostics through check annotations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for file in Path('checks').rglob('*'):
              if file.is_file() and file.suffix in ('.log', '.json'):
                  content = file.read_text(encoding='utf-8-sig', errors='replace')[-6500:]
                  for offset in range(0, len(content), 2800):
                      message = (str(file) + f' offset={offset}\n' + content[offset:offset + 2800]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::notice title=Windows launch diagnostics::' + message)
          PY
  startup:
    if: inputs.mode == 'desktop'
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        renderer: [default, software]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: downloaded-app
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Open the downloaded Windows app beyond its splash screen
        shell: pwsh
        run: ./buildscripts/ci/windows/check_evanscore_gui.ps1 -InstallRoot downloaded-app -Renderer '${{ matrix.renderer }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: startup-${{ matrix.renderer }}
          path: build.artifacts/gui/
          retention-days: 14

  exceptions:
    if: inputs.mode == 'exceptions'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: downloaded-app
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Observe native exceptions on the Windows desktop
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./buildscripts/ci/windows/observe_evanscore_exceptions.ps1 -InstallRoot downloaded-app > exception-observer.log 2>&1
          $content = Get-Content exception-observer.log -Raw
          for ($offset = 0; $offset -lt $content.Length; $offset += 2800) {
            $chunk = $content.Substring($offset, [Math]::Min(2800, $content.Length - $offset)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::notice title=Native exception observation::$chunk"
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-exception-observer
          path: exception-observer.log
          retention-days: 3
