name: EvanScore Windows startup diagnostic

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Windows app build run to test
        required: true
        default: '37817852210'
      artifact_name:
        description: App artifact to inspect (diagnostic-only archives are not releases)
        type: choice
        options:
          - EvanScore-Windows-x64
          - EvanScore-Windows-diagnostic-only
        default: EvanScore-Windows-x64
      log_artifact:
        description: Diagnostic log artifact to inspect
        default: EvanScore-Windows-build-checks
      image_name:
        description: Screenshot to inspect
        type: choice
        options:
          - desktop.png
          - feature-debug.png
        default: desktop.png
      mode:
        description: Inspect launch logs or run desktop checks
        type: choice
        options:
          - inspect-logs
          - desktop
          - exceptions
          - layout
          - verify-package
          - dynamics
          - crash-kit
          - vdl-setup
          - vdl-package
        default: inspect-logs

permissions:
  actions: read
  contents: read

jobs:
  vdl-setup:
    if: inputs.mode == 'vdl-setup'
    uses: ./.github/workflows/check_evanscore_vdl_setup.yml
    with:
      verify_download: true
  vdl-package:
    if: inputs.mode == 'vdl-package'
    uses: ./.github/workflows/check_evanscore_vdl_setup.yml
    with:
      base_run: ${{ inputs.run_id }}
      verify_download: false
  crash-kit:
    if: inputs.mode == 'crash-kit'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile normal and faulting capture fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force capture-test | Out-Null
          @'
          #include <windows.h>
          int main(void) {
            SetErrorMode(SEM_NOGPFAULTERRORBOX);
          #ifdef CAPTURE_FAULT
            volatile int *address = 0;
            return *address;
          #else
            return 0;
          #endif
          }
          '@ | Set-Content capture-test/fixture.c
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsInstall 'VC/Auxiliary/Build/vcvars64.bat'
          @"
          @echo off
          call "$vcvars" > nul
          if errorlevel 1 exit /b %errorlevel%
          cd capture-test
          cl /nologo /Zi fixture.c /Fe:normal.exe
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /Zi /DCAPTURE_FAULT fixture.c /Fe:fault.exe
          "@ | Set-Content capture-test/build.bat
          cmd /c capture-test\build.bat
          if ($LASTEXITCODE -ne 0) { throw 'Capture fixture compilation failed' }
      - name: Verify clean exit and capture a real access violation
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File buildscripts/ci/windows/capture_evanscore_crash.ps1 -AppPath capture-test/normal.exe -OutputDirectory capture-test/normal-report
          if ($LASTEXITCODE -ne 0) { throw 'Normal capture fixture failed' }
          if (Get-ChildItem capture-test/normal-report -Filter '*.dmp') { throw 'Clean fixture produced a false fault report' }
          powershell.exe -NoProfile -File buildscripts/ci/windows/capture_evanscore_crash.ps1 -AppPath capture-test/fault.exe -OutputDirectory capture-test/fault-report
          if ($LASTEXITCODE -ne 0) { throw 'Fault capture fixture failed' }
          $dump = Get-ChildItem capture-test/fault-report -Filter '*.dmp' | Select-Object -First 1
          if (-not $dump -or $dump.Length -lt 1024) { throw 'The native access violation did not produce a dump' }
          $bytes = [System.IO.File]::ReadAllBytes($dump.FullName)
          if ([System.Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'MDMP') { throw 'Invalid minidump header' }
          python buildscripts/ci/windows/verify_crash_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Fault context verification failed' }
          Write-Host "::notice title=Crash capture verified::Normal native exit and actual access-violation capture passed; dump=$($dump.Length) bytes"
      - name: Stage the standalone capture launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force crash-kit | Out-Null
          Copy-Item buildscripts/ci/windows/capture_evanscore_crash.ps1 crash-kit/
          Copy-Item 'buildscripts/ci/windows/Debug EvanScore.cmd' crash-kit/
          @'
          This is a diagnostic launcher, not a fixed app.
          Extract these two files into your existing EvanScore folder, next to bin.
          Double-click Debug EvanScore.cmd. Open your score and reproduce the crash.
          Zip the new crash-report folder and attach it to the chat, along with the affected score.
          It saves a fault minidump, a capture transcript, and the latest app log locally.
          Dumps can contain fragments of the open score and other process memory.
          Nothing is uploaded automatically. No registry or application settings are changed.
          Closing the capture console does not intentionally terminate the app.
          '@ | Set-Content crash-kit/README.txt
      - uses: actions/upload-artifact@v7
        with:
          name: EvanScore-Crash-Capture
          path: crash-kit/
          retention-days: 7
  verify-package:
    if: inputs.mode == 'verify-package'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Confirm the native build and source
        id: native
        uses: actions/github-script@v8
        env:
          EVANSCORE_NATIVE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const runId = Number(process.env.EVANSCORE_NATIVE_RUN_ID);
            if (!Number.isSafeInteger(runId)) throw new Error('Invalid native run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: runId});
            if (run.status !== 'completed' || run.path !== '.github/workflows/build_evanscore_windows.yml' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('The package must come from a completed native app build in this repository');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner: context.repo.owner, repo: context.repo.repo, run_id: runId});
            if (!jobs.some(job => job.steps?.some(step => step.name === 'Compile and deploy the native app' && step.conclusion === 'success'))) {
              throw new Error('The native app did not compile and deploy successfully');
            }
            core.setOutput('sha', run.head_sha);
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: build.install
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Inspect downloaded runtime dependencies
        shell: pwsh
        run: ./buildscripts/ci/windows/inspect_evanscore_package.ps1 -InstallRoot build.install
      - name: Verify the downloaded full Windows package
        shell: pwsh
        env:
          EVANSCORE_NATIVE_SOURCE_SHA: ${{ steps.native.outputs.sha }}
        run: ./buildscripts/ci/windows/verify_evanscore_app.ps1
      - name: Upload the verified runnable app
        uses: actions/upload-artifact@v7
        with:
          name: EvanScore-Windows-x64
          path: build.install/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EvanScore-Windows-build-checks
          path: build.artifacts/
          if-no-files-found: ignore
          retention-days: 14

  inspect:
    if: inputs.mode == 'inspect-logs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        if: ${{ !startsWith(inputs.log_artifact, 'job:') }}
        with:
          name: ${{ inputs.log_artifact }}
          path: checks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Retrieve a completed job log when requested
        if: startsWith(inputs.log_artifact, 'job:')
        uses: actions/github-script@v8
        env:
          JOB_LOG_SELECTOR: ${{ inputs.log_artifact }}
        with:
          script: |
            const jobId = Number(process.env.JOB_LOG_SELECTOR.slice(4));
            if (!Number.isSafeInteger(jobId)) throw new Error('Invalid job ID');
            try {
              const result = await github.rest.actions.downloadJobLogsForWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, job_id: jobId});
              const fs = require('fs');
              fs.mkdirSync('checks', {recursive: true});
              const log = typeof result.data === 'string' ? result.data : Buffer.from(result.data).toString();
              fs.writeFileSync('checks/job.log', log);
              // Keep huge compiler command lines from hiding other failures in
              // the bounded check annotations. The full log remains available.
              const errors = log.split('\n').filter(line => /FAILED:|error C\d|fatal error|sccache: error|CMake Error|error LNK/i.test(line));
              fs.writeFileSync('checks/compiler-errors.log', errors.join('\n'));
            } catch (error) {
              core.notice('Job log retrieval failed: ' + error.message);
              throw error;
            }
      - name: Report first compiler errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path('checks/compiler-errors.log')
          if file.exists():
              content = file.read_text(encoding='utf-8-sig', errors='replace')[:18000]
              for offset in range(0, len(content), 2800):
                  message = content[offset:offset+2800].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=First compiler errors::' + message)
          PY
      - name: Report launch diagnostics through check annotations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [f for f in Path('checks').rglob('*') if f.is_file() and f.suffix in ('.log', '.json')]
          # Fatal inspector assertions can be buried beneath the docking
          # library's large geometry dump. Report them before bounded tails.
          import re
          failures = []
          for file in files:
              for line in file.read_text(encoding='utf-8-sig', errors='replace').splitlines():
                  if re.search(r'FATAL|qFatal|Main articulations|Articulation disclosure|Articulation smoothing|custom dynamics switch|Could not dispatch|DYNAMICS INSPECTOR', line, re.I):
                      failures.append(f'{file}: {line[:1200]}')
          if failures:
              content = '\n'.join(failures)[-24000:]
              for offset in range(0, len(content), 2800):
                  message = content[offset:offset + 2800].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=Native interaction diagnostics::' + message)
          PY
      - name: Report remaining launch logs through check annotations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [f for f in Path('checks').rglob('*') if f.is_file() and f.suffix in ('.log', '.json')]
          def priority(file):
              if file.name == 'stderr.log': return (0, str(file))
              if file.suffix == '.json': return (1, str(file))
              if file.name.startswith('MuseScore'): return (2, 0 if file.parent.name.endswith('score') else 1, str(file))
              return (3, str(file))
          # GitHub accepts only ten notice annotations per step. Prioritize
          # native stderr and window state so verbose Qt logs cannot hide them.
          notices = 0
          for file in sorted(files, key=priority):
              content = file.read_text(encoding='utf-8-sig', errors='replace')[-6500:]
              for offset in range(0, len(content), 2800):
                  if notices >= 10: break
                  message = (str(file) + f' offset={offset}\n' + content[offset:offset + 2800]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=Windows launch diagnostics::' + message)
                  notices += 1
          PY
      - name: Report exception stacks separately from layout dumps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for file in Path('checks').rglob('*exceptions.log'):
              lines = file.read_text(encoding='utf-8-sig', errors='replace').splitlines()
              content = '\n'.join(line for line in lines if re.match(r'Observer |Exception |MSVC |Symbol|Unwound|  0x|Main thread snapshot|Thread name:|Stack observation:', line))[-24000:]
              for offset in range(0, len(content), 2800):
                  message = (str(file) + '\n' + content[offset:offset+2800]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=Native exception stack::' + message)
          PY
      - name: Report beginning of failed snare launch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('checks').rglob('drum-score/stderr.log'))
          files += sorted(Path('checks').rglob('drum-score/MuseScore*.log'))
          for file in files:
              content = file.read_text(encoding='utf-8-sig', errors='replace')
              head = content[:12000]
              for offset in range(0, len(head), 2800):
                  message = (str(file) + f' length={len(content)} offset={offset}\n' + head[offset:offset+2800]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=Snare launch beginning::' + message)
          PY
      - name: Report small desktop capture for startup inspection
        env:
          INSPECT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          python3 -m venv /tmp/capture-tools
          /tmp/capture-tools/bin/pip install --quiet pillow
          /tmp/capture-tools/bin/python - <<'PY'
          from pathlib import Path
          import base64
          import os
          from io import BytesIO
          from PIL import Image
          image_name = os.environ.get('INSPECT_IMAGE_NAME') or 'desktop.png'
          if image_name not in ('desktop.png', 'feature-debug.png'):
              raise RuntimeError('Unsupported capture name')
          files = sorted(Path('checks').rglob(image_name))
          if files:
              file = next((f for f in files if f.parent.name.endswith('score')), files[0])
              data = file.read_bytes()
              if len(data) > 20000:
                  preview = Image.open(file).convert('RGB')
                  for width in (900, 720, 600, 480):
                      resized = preview.copy()
                      resized.thumbnail((width, width))
                      for quality in (65, 50, 35, 25):
                          buffer = BytesIO()
                          resized.save(buffer, format='JPEG', quality=quality, optimize=True)
                          data = buffer.getvalue()
                          if len(data) <= 20000: break
                      if len(data) <= 20000: break
              if len(data) <= 20000:
                  encoded = base64.b64encode(data).decode('ascii')
                  parts = [encoded[i:i+2800] for i in range(0, len(encoded), 2800)]
                  for index, part in enumerate(parts):
                      message = f'Screenshot part={index} count={len(parts)} bytes={len(data)}\n{part}'
                      print('::notice title=Desktop capture::' + message.replace('\n', '%0A'))
              else:
                  print(f'::notice title=Desktop capture::Capture is retained in the artifact; {len(data)} bytes exceeds the bounded annotation limit.')
          PY
  startup:
    if: inputs.mode == 'desktop'
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        renderer: [default, software]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: downloaded-app
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Open the downloaded Windows app beyond its splash screen
        shell: pwsh
        run: |
          ./buildscripts/ci/windows/check_evanscore_gui.ps1 -InstallRoot downloaded-app -OutputDirectory build.artifacts/gui-empty -Renderer '${{ matrix.renderer }}'
          ./buildscripts/ci/windows/check_evanscore_gui.ps1 -InstallRoot downloaded-app -OutputDirectory build.artifacts/gui-score -Renderer '${{ matrix.renderer }}' -ScorePath src/engraving/tests/tuplet_data/tuplet1-ref.mscx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: startup-${{ matrix.renderer }}
          path: build.artifacts/gui-*/
          retention-days: 14

  exceptions:
    if: inputs.mode == 'exceptions'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: downloaded-app
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Get matching native symbols when available
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: EvanScore-Windows-native-symbols
          path: native-symbols
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Place symbols alongside the executable
        shell: pwsh
        run: |
          $app = Get-ChildItem downloaded-app -Filter 'MuseScore*.exe' -Recurse | Select-Object -First 1
          if (Test-Path native-symbols) {
            Get-ChildItem native-symbols -Filter '*.pdb' -Recurse | ForEach-Object { Copy-Item $_.FullName $app.DirectoryName }
          }
      - name: Observe native exceptions on the Windows desktop
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./buildscripts/ci/windows/observe_evanscore_exceptions.ps1 -InstallRoot downloaded-app > exception-observer.log 2>&1
          $content = Get-Content exception-observer.log -Raw
          for ($offset = 0; $offset -lt $content.Length; $offset += 2800) {
            $chunk = $content.Substring($offset, [Math]::Min(2800, $content.Length - $offset)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::notice title=Native exception observation::$chunk"
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-exception-observer
          path: exception-observer.log
          retention-days: 3

  layout:
    if: inputs.mode == 'layout' || inputs.mode == 'dynamics'
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        trial: ${{ fromJSON(inputs.mode == 'dynamics' && '["dynamics"]' || '["baseline", "left", "wide"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: downloaded-app
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Get matching symbols for repeated-score crash tracing
        if: inputs.mode == 'dynamics'
        uses: actions/download-artifact@v5
        with:
          name: EvanScore-Windows-native-symbols
          path: native-symbols
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Place matching symbols beside the tested executable
        if: inputs.mode == 'dynamics'
        shell: pwsh
        run: |
          $app = Get-ChildItem downloaded-app -Filter 'MuseScore*.exe' -Recurse | Select-Object -First 1
          $symbols = @(Get-ChildItem native-symbols -Filter '*.pdb' -Recurse)
          if (-not $app -or $symbols.Count -eq 0) { throw 'Matching native crash symbols are missing' }
          $symbols | ForEach-Object { Copy-Item $_.FullName $app.DirectoryName }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat qtnetworkauth qtshadertools qtwebsockets
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          py7zrversion: '@git+https://github.com/miurahr/py7zr.git'
      - name: Build isolated runtime inspector
        shell: pwsh
        run: |
          @'
          @echo off
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL_DIR=%%i"
          call "%VS_INSTALL_DIR%\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S buildscripts/ci/windows/startup-inspector -B inspector -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo || exit /b 1
          cmake --build inspector || exit /b 1
          '@ | Set-Content inspector-build.cmd
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cmd /c inspector-build.cmd > inspector-build.log 2>&1
          $buildExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $content = Get-Content inspector-build.log -Raw
          Write-Host $content
          if ($buildExit -ne 0) {
            if ($content.Length -gt 18000) { $content = $content.Substring($content.Length - 18000) }
            for ($offset = 0; $offset -lt $content.Length; $offset += 2800) {
              $chunk = $content.Substring($offset, [Math]::Min(2800, $content.Length - $offset)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::notice title=Inspector build::$chunk"
            }
            throw 'Inspector build failed'
          }
      - name: Test layout and score opening
        shell: pwsh
        env:
          EVANSCORE_LAYOUT_TRIAL: ${{ matrix.trial }}
        run: |
          $app = Get-ChildItem downloaded-app -Filter 'MuseScore*.exe' -Recurse | Select-Object -First 1
          $destination = Join-Path $app.DirectoryName 'platformthemes'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item inspector/plugins/platformthemes/*.dll $destination
          Get-ChildItem inspector -Filter 'evanscore-startup-inspector.pdb' -Recurse | ForEach-Object { Copy-Item $_.FullName $destination }
          $env:QT_PLUGIN_PATH = $app.DirectoryName
          $env:QT_QPA_PLATFORMTHEME = 'evanscore-inspector'
          if ($env:EVANSCORE_LAYOUT_TRIAL -eq 'baseline') {
            pwsh -NoProfile -File ./buildscripts/ci/windows/observe_evanscore_exceptions.ps1 -InstallRoot downloaded-app > inspector-exceptions.log 2>&1
          }
          try {
            ./buildscripts/ci/windows/check_evanscore_gui.ps1 -InstallRoot downloaded-app -OutputDirectory checks/empty
            $interactionTime = if ($env:EVANSCORE_LAYOUT_TRIAL -eq 'dynamics') { 40 } else { 0 }
            $env:EVANSCORE_FEATURE_DEBUG_CAPTURE = [System.IO.Path]::GetFullPath('checks/score/feature-debug.png')
            ./buildscripts/ci/windows/check_evanscore_gui.ps1 -InstallRoot downloaded-app -OutputDirectory checks/score -ScorePath src/engraving/tests/tuplet_data/tuplet1-ref.mscx -MinimumOpenSeconds $interactionTime
            if ($env:EVANSCORE_LAYOUT_TRIAL -eq 'dynamics') {
              $env:EVANSCORE_EXPECT_MUSICAL_TIME = '1'
              $env:EVANSCORE_FEATURE_DEBUG_CAPTURE = [System.IO.Path]::GetFullPath('checks/drum-score/feature-debug.png')
              ./buildscripts/ci/windows/check_evanscore_gui.ps1 -InstallRoot downloaded-app -OutputDirectory checks/drum-score -ScorePath buildscripts/ci/windows/fixtures/ff-snare.mscx -MinimumOpenSeconds $interactionTime
              foreach ($folder in @('score', 'drum-score')) {
                $logs = (Get-ChildItem "checks/$folder" -Filter '*.log' | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
                foreach ($marker in @('transport pointer toggle, alignment and format checks passed', 'mapping restored after native undo', 'repeated mixed edits: 12 cycles, 36 edits and 36 undo passed', 'general panel and resize checks passed', 'mixer visibility and ownership checks passed', 'feature diagnostics real report, scope, copy, resize and close passed', 'mapping save requested')) {
                  if (-not $logs.Contains("DYNAMICS INSPECTOR $marker")) {
                    throw "The native interaction check did not complete in ${folder}: $marker"
                  }
                }
              }
              python buildscripts/ci/windows/startup-inspector/verify_saved_dynamics.py
              if ($LASTEXITCODE -ne 0) { throw 'Native score dynamics persistence verification failed' }
              # Converter mode starts the real audio engine without requiring
              # a physical Windows audio device. This covers MS Basic audio;
              # it does not substitute for an installed Muse Drumline test.
              foreach ($folder in @('score', 'drum-score')) {
                $score = Get-ChildItem "checks/$folder" -Filter '*.mscz' | Select-Object -First 1
                $wav = Join-Path $score.DirectoryName 'custom-dynamics.wav'
                $render = Start-Process -FilePath $app.FullName -WorkingDirectory $app.DirectoryName -PassThru `
                  -ArgumentList @('-o', ('"' + $wav + '"'), ('"' + $score.FullName + '"')) `
                  -RedirectStandardOutput (Join-Path $score.DirectoryName 'audio-export-stdout.log') `
                  -RedirectStandardError (Join-Path $score.DirectoryName 'audio-export-stderr.log')
                if (-not $render.WaitForExit(120000)) { $render.Kill(); throw "Custom dynamics audio export timed out in $folder" }
                $render.Refresh()
                if ($render.ExitCode -ne 0 -or -not (Test-Path $wav)) { throw "Custom dynamics audio export failed in $folder, exit=$($render.ExitCode)" }
              }
              python buildscripts/ci/windows/startup-inspector/verify_dynamics_audio.py
              if ($LASTEXITCODE -ne 0) { throw 'Custom dynamics audio output verification failed' }
            }
          } catch {
            $message = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::notice title=Layout trial failure::$message"
            if ($env:EVANSCORE_LAYOUT_TRIAL -eq 'dynamics' -and (Test-Path checks/drum-score/ff-snare.mscz)) {
              pwsh -NoProfile -File ./buildscripts/ci/windows/observe_evanscore_exceptions.ps1 -InstallRoot downloaded-app -ScorePath checks/drum-score/ff-snare.mscz > checks/inspector-exceptions.log 2>&1
            }
            throw
          }
      - name: Report captured fault stack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path checks/inspector-exceptions.log) {
            $content = ((Get-Content checks/inspector-exceptions.log) | Where-Object { $_ -match '^Observer |^Exception |^MSVC |^Symbol|^Unwound|^  0x|^Main thread snapshot|^Thread name:|^Stack observation:' }) -join "`n"
            if ($content.Length -gt 24000) { $content = $content.Substring($content.Length - 24000) }
            for ($offset = 0; $offset -lt $content.Length; $offset += 2800) {
              $chunk = $content.Substring($offset, [Math]::Min(2800, $content.Length - $offset)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::notice title=Native exception stack::$chunk"
            }
          }
      - name: Report bounded inspector diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem checks -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'stderr.log' -or $_.Name -eq 'startup-state.json' -or $_.Name -like 'MuseScore*.log' } | ForEach-Object {
            $content = (Get-Content $_.FullName -Raw)
            if ($_.Name -like 'MuseScore*.log') {
              $content = (($content -split "`n") | Where-Object { $_ -match 'DYNAMICS INSPECTOR|ERROR|ASSERT' }) -join "`n"
            }
            if ($content.Length -gt 16000) { $content = $content.Substring($content.Length - 16000) }
            for ($offset = 0; $offset -lt $content.Length; $offset += 2800) {
              $chunk = $content.Substring($offset, [Math]::Min(2800, $content.Length - $offset)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::notice title=Layout experiment::$($_.Name) $chunk"
            }
          }
          if (Test-Path inspector-build.log) {
            $content = Get-Content inspector-build.log -Raw
            if ($content.Length -gt 16000) { $content = $content.Substring($content.Length - 16000) }
            for ($offset = 0; $offset -lt $content.Length; $offset += 2800) {
              $chunk = $content.Substring($offset, [Math]::Min(2800, $content.Length - $offset)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::notice title=Inspector build::$chunk"
            }
          }
          if (Test-Path inspector-exceptions.log) {
            $content = Get-Content inspector-exceptions.log -Raw
            if ($content.Length -gt 12000) { $content = $content.Substring(0, 12000) }
            for ($offset = 0; $offset -lt $content.Length; $offset += 2800) {
              $chunk = $content.Substring($offset, [Math]::Min(2800, $content.Length - $offset)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::notice title=Inspector exception::$chunk"
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: layout-${{ matrix.trial }}
          path: checks/
          retention-days: 3
