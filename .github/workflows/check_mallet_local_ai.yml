name: EvanScore real local mallet AI
on:
  workflow_dispatch:
  push:
    branches: [codex/rounded-ui-windows-preview]
    paths: ['.github/workflows/check_mallet_local_ai.yml']
permissions:
  contents: read
jobs:
  local-ai:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          py7zrversion: '@git+https://github.com/miurahr/py7zr.git'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build the actual native assistant client
        shell: pwsh
        run: |
          cmake -S tools/mallet_ai_contract -B ai-contract-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'AI contract configuration failed' }
          cmake --build ai-contract-build --parallel 3
          if ($LASTEXITCODE -ne 0) { throw 'AI contract compilation failed' }
      - name: Exercise actual native setup, real inference, and model unloading
        shell: pwsh
        run: |
          & ./ai-contract-build/mallet-ai-contract.exe --setup ai-response.json *> ai-native.log
          $nativeExit=$LASTEXITCODE
          if ($nativeExit -ne 0) {
            $detail=(Get-Content ai-native.log -Tail 24) -join "`n"
            $detail=$detail -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error title=Actual local AI setup/inference::$detail"
            throw "Native setup/inference failed ($nativeExit)"
          }
          $root = Join-Path $env:LOCALAPPDATA 'EvanScore/local-ai'
          $license=(Get-Content (Join-Path $root 'MODEL-LICENSE.txt') -TotalCount 8) -join ' '
          Write-Output "::notice title=Installed model license::$license"
          $result=Get-Content ai-response.json -Raw | ConvertFrom-Json
          $summary=(@($result.responses | ForEach-Object { $_.result }) | ConvertTo-Json -Compress -Depth 6) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
          Write-Output "::notice title=Real native AI response::$summary"
          Write-Output '::notice title=Local AI memory::Actual native setup succeeded; model unloaded after the real response'
          Copy-Item (Join-Path $root 'setup-service*.log') . -ErrorAction SilentlyContinue
          $PSNativeCommandUseErrorActionPreference=$false
          & ./ai-contract-build/mallet-ai-contract.exe --abrupt-exit *> ai-abrupt.log
          if ($LASTEXITCODE -ne 73) { Get-Content ai-abrupt.log -Tail 12; throw 'Abrupt-exit fixture did not reach its owned-service checkpoint' }
          $alive=$true
          for ($n=0; $n -lt 40; $n++) {
            try { $null=Invoke-RestMethod http://127.0.0.1:11435/api/version -TimeoutSec 1 } catch { $alive=$false; break }
            Start-Sleep -Milliseconds 250
          }
          if ($alive) { throw 'Private AI service survived abrupt application exit' }
          $global:LASTEXITCODE=0
          Write-Output '::notice title=Private runtime ownership::Kernel cleanup stopped the private service after abrupt application exit'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-local-mallet-ai
          path: |
            ai-*.log
            ai-response.json
          retention-days: 7
